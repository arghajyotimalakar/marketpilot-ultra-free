name: Free scheduled market research
on:
  workflow_dispatch:
  schedule:
    # GitHub cron is in UTC. IST = UTC+05:30.
    - cron: '30 1 * * *'     # 07:00 IST every day (including weekend news)
    - cron: '0 4 * * 1-5'    # 09:30 IST
    - cron: '30 4 * * 1-5'   # 10:00 IST
    - cron: '30 7 * * 1-5'   # 13:00 IST
    - cron: '30 8 * * 1-5'   # 14:00 IST
    - cron: '0 10 * * 1-5'   # 15:30 IST
    - cron: '0 11 * * 1-5'   # 16:30 IST (end-of-day synthesis)
permissions:
  contents: write
concurrency:
  group: marketpilot-reports
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify Python scripts compile
        run: python -m py_compile app.py scheduled_market_update.py
      - name: Fetch data and write latest report
        run: python scheduled_market_update.py
        env:
          MAX_SYMBOLS_PER_RUN: '125'
      - name: Commit and push data (if changed)
        run: |
          git config user.name "marketpilot-reporter[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/reports/
          git diff --cached --quiet || (git commit -m "MarketPilot scheduled market report" && git push)
